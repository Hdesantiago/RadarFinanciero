name: Actualizar noticias financieras

on:
  schedule:
    # Cada 6 horas: 00:00, 06:00, 12:00, 18:00 UTC
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-news
  cancel-in-progress: false

jobs:
  recopilar:
    name: Recopilar y publicar noticias
    runs-on: ubuntu-latest
    steps:
      - name: Obtener código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar recopilador
        run: node scripts/collect-news.js

      - name: Validar JSON generados
        run: |
          node -e "
            const fs = require('fs');
            const archivos = ['news.json','countries.json','categories.json','sources-status.json','last-update.json'];
            for (const a of archivos) {
              const ruta = 'public/data/' + a;
              if (!fs.existsSync(ruta)) { console.error('FALTA: ' + ruta); process.exit(1); }
              JSON.parse(fs.readFileSync(ruta, 'utf8'));
              console.log('OK: ' + a);
            }
          "

      - name: Verificar si hay cambios
        id: cambios
        run: |
          if git diff --quiet public/data/; then
            echo "hay_cambios=false" >> "$GITHUB_OUTPUT"
            echo "Sin cambios en los datos."
          else
            echo "hay_cambios=true" >> "$GITHUB_OUTPUT"
            echo "Cambios detectados en los datos."
          fi

      - name: Guardar y publicar cambios
        if: steps.cambios.outputs.hay_cambios == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/
          git commit -m "datos: actualización automática de noticias $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
