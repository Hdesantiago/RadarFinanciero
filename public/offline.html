<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b1220" />
    <title>Sin conexión — RADAR FINANCIERO</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0b1220;
        color: #e6edf7;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        text-align: center;
        padding: 1.5rem;
      }
      .tarjeta {
        max-width: 28rem;
        background: #131c30;
        border: 1px solid #22304d;
        border-radius: 1rem;
        padding: 2.5rem 2rem;
      }
      .icono { font-size: 3rem; }
      h1 { font-size: 1.4rem; margin: 1rem 0 .5rem; }
      p { color: #8fa1bd; }
      button {
        background: #f0b90b;
        color: #0b1220;
        border: 0;
        border-radius: .5rem;
        padding: .65rem 1.5rem;
        font-weight: 600;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main class="tarjeta">
      <div class="icono" aria-hidden="true">📡</div>
      <h1>Sin conexión a Internet</h1>
      <p>
        No fue posible cargar la página solicitada. Las noticias y favoritos que
        hayas descargado siguen disponibles dentro de la aplicación instalada.
      </p>
      <p>RADAR FINANCIERO se sincronizará cuando se restablezca la conexión.</p>
      <button type="button" onclick="location.reload()">Reintentar</button>
    </main>
  </body>
</html>
